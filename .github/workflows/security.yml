name: Security checks

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Reject committed credentials
        shell: bash
        run: |
          if git grep -l -I -E '(AKIA[0-9A-Z]{16}|whsec_[A-Za-z0-9_+/=-]{20,}|re_[A-Za-z0-9_]{20,})' -- . ':!*.example'; then
            echo "Potential credential found in a tracked file."
            exit 1
          fi
      - name: Test backend
        run: ./mvnw -q test
