server.port=5000

# MongoDB
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/hi_app}
spring.data.mongodb.database=${MONGODB_DB_NAME:hi_app}

# JWT
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRES_MS:604800000}
app.auth.cookie.secure=${AUTH_COOKIE_SECURE:true}

# CORS
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173},http://localhost:8081,${FRONTEND_URLS:https://hilover.space,https://www.hilover.space}
app.cors.allow-vercel-preview=${ALLOW_VERCEL_PREVIEW:false}
app.swagger.public=${SWAGGER_PUBLIC:false}

# Admin
app.admin.emails=${ADMIN_EMAILS:admin@example.com}

# Google OAuth
app.google.client-id=${GOOGLE_CLIENT_ID:}
app.osm.overpass-url=${OSM_OVERPASS_URL:https://overpass-api.de/api/interpreter}
app.osm.photon-url=${OSM_PHOTON_URL:https://photon.komoot.io/api}
app.osm.cache-ttl-hours=${OSM_CACHE_TTL_HOURS:24}
app.tomtom.search-api-key=${TOMTOM_SEARCH_API_KEY:}
app.tomtom.search-url=${TOMTOM_SEARCH_URL:https://api.tomtom.com/search/2/search}
app.vietmap.api-key=${VIETMAP_API_KEY:}
app.vietmap.autocomplete-url=${VIETMAP_AUTOCOMPLETE_URL:https://maps.vietmap.vn/api/autocomplete/v4}
app.vietmap.place-url=${VIETMAP_PLACE_URL:https://maps.vietmap.vn/api/place/v4}
app.couple-places.report-hide-threshold=${COUPLE_PLACE_REPORT_HIDE_THRESHOLD:3}
app.couple-places.photo-upload-enabled=${COUPLE_PLACE_PHOTO_UPLOAD_ENABLED:false}
app.s3.user-media-bucket=${AWS_S3_USER_MEDIA_BUCKET:}
app.s3.region=${AWS_S3_REGION:${AWS_REGION:us-east-1}}
app.s3.public-base-url=${AWS_S3_PUBLIC_BASE_URL:}
app.trusted-proxy-cidrs=${TRUSTED_PROXY_CIDRS:127.0.0.1/32,::1/128}
app.rate-limit.hash-secret=${RATE_LIMIT_HASH_SECRET:${JWT_SECRET:}}

# AWS Bedrock
aws.region=${AWS_REGION:us-east-1}
aws.access-key-id=${AWS_ACCESS_KEY_ID:}
aws.secret-access-key=${AWS_SECRET_ACCESS_KEY:}
app.bedrock.model-id=${BEDROCK_MODEL_ID:anthropic.claude-3-haiku-20240307-v1:0}

# Logging
logging.level.com.hi=${APP_LOG_LEVEL:INFO}
logging.level.org.springframework.security=WARN

# Jackson
spring.jackson.default-property-inclusion=non_null

# Email Configuration (Sử dụng Gmail)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:hilover.space@gmail.com}
# Mật khẩu ứng dụng (App Password) của Gmail, KHÔNG phải mật khẩu đăng nhập bình thường
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Resend transactional email for OTP delivery tracking
app.resend.api-key=${RESEND_API_KEY:}
app.resend.webhook-secret=${RESEND_WEBHOOK_SECRET:}
app.resend.from-email=${RESEND_FROM_EMAIL:}

# PayOS
app.payos.client-id=${PAYOS_CLIENT_ID:}
app.payos.api-key=${PAYOS_API_KEY:}
app.payos.checksum-key=${PAYOS_CHECKSUM_KEY:}
app.client-url=${CLIENT_URL:http://localhost:5173}
app.mobile-return-url=${MOBILE_RETURN_URL:https://hilover.space}
app.payment.return-url.allowed-origins=${PAYMENT_RETURN_ALLOWED_ORIGINS:${CLIENT_URL:http://localhost:5173}}

# Springdoc / Swagger UI
springdoc.api-docs.path=/v3/api-docs

# Spring AI - Gemini (via OpenAI-compatible API)
# Set AI_CHAT_PROVIDER=none to disable chat model auto-configuration.
spring.ai.model.chat=${AI_CHAT_PROVIDER:openai}
spring.ai.openai.api-key=${API_GEMINI:disabled}
spring.ai.openai.chat.base-url=https://generativelanguage.googleapis.com
spring.ai.openai.chat.completions-path=/v1beta/openai/chat/completions
spring.ai.openai.chat.options.model=gemini-2.5-flash
spring.ai.retry.max-attempts=${AI_RETRY_MAX_ATTEMPTS:2}
spring.ai.retry.backoff.initial-interval=${AI_RETRY_INITIAL_INTERVAL:500ms}
spring.ai.retry.backoff.multiplier=${AI_RETRY_MULTIPLIER:2}
spring.ai.retry.backoff.max-interval=${AI_RETRY_MAX_INTERVAL:2s}
spring.http.client.connect-timeout=30s
spring.http.client.read-timeout=60s
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha

# Affiliate marketing / TikTok Shop sync
app.affiliate.sync.enabled=${AFFILIATE_SYNC_ENABLED:false}
app.affiliate.sync.cron=${AFFILIATE_SYNC_CRON:0 0 */6 * * *}
app.affiliate.tiktok.products-url=${TIKTOK_PRODUCTS_URL:}
app.affiliate.tiktok.access-token=${TIKTOK_ACCESS_TOKEN:}
app.affiliate.tiktok.auth-header-name=${TIKTOK_AUTH_HEADER_NAME:Authorization}
app.affiliate.tiktok.auth-header-prefix=${TIKTOK_AUTH_HEADER_PREFIX:Bearer }
app.affiliate.shopee.products-url=${SHOPEE_PRODUCTS_URL:}
app.affiliate.shopee.access-token=${SHOPEE_ACCESS_TOKEN:}
app.affiliate.shopee.auth-header-name=${SHOPEE_AUTH_HEADER_NAME:Authorization}
app.affiliate.shopee.auth-header-prefix=${SHOPEE_AUTH_HEADER_PREFIX:Bearer }

# Got It Biz API / voucher marketplace
app.gotit.enabled=${GOTIT_ENABLED:false}
app.gotit.commerce-enabled=${GOTIT_COMMERCE_ENABLED:false}
app.gotit.mode=${GOTIT_MODE:mock}
app.gotit.base-url=${GOTIT_BASE_URL:https://api-biz-stg.gotit.vn}
app.gotit.api-key=${GOTIT_API_KEY:}

# Canonical health data
app.symptom-dictionary.seed-enabled=${SYMPTOM_DICTIONARY_SEED_ENABLED:true}
app.migration.health-data.enabled=${HEALTH_DATA_MIGRATION_ENABLED:false}
app.migration.health-data.dry-run=${HEALTH_DATA_MIGRATION_DRY_RUN:true}
app.migration.health-data.report-path=${HEALTH_DATA_MIGRATION_REPORT_PATH:}
